services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      DATABASE_USER: ${DATABASE_USER:-booking}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-booking}
      DATABASE_NAME: ${DATABASE_NAME:-booking}
    ports:
      # Host port 5433, not 5432 — this machine already runs a native
      # PostgreSQL 18 Windows service bound to 5432.
      - "5433:5432"
    volumes:
      # postgres:18+ images store data under major-version-specific
      # subdirectories of /var/lib/postgresql (not .../data directly) —
      # https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-booking} -d ${DATABASE_NAME:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
