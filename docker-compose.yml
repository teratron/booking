services:
  app:
    # PHP-FPM. The same image serves the queue worker and the CLI, so the
    # runtime a job fails on is the runtime the request ran on.
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Pinned explicitly: docker/app/Dockerfile now also defines a
      # `production` stage (the release artefact `release.yml` builds), and
      # an unpinned build resolves to whichever stage is declared last in
      # the file. Without this, a bind-mounted dev container would silently
      # come up on the production target — no Composer, no pnpm, no pcov.
      target: base
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      # Service names, not 127.0.0.1: inside the compose network the host's
      # published ports are not what these containers talk to. .env keeps the
      # host-side values so tooling run from Windows still connects.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Queue supervision as a deployment mode of the same image, never a
    # second deployable — Horizon supervises every queue declared in
    # config/horizon.php (notifications, analytics, bulk, backups, default),
    # replacing the single-queue queue:work command this service ran before
    # Horizon was installed.
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Pinned explicitly: docker/app/Dockerfile now also defines a
      # `production` stage (the release artefact `release.yml` builds), and
      # an unpinned build resolves to whichever stage is declared last in
      # the file. Without this, a bind-mounted dev container would silently
      # come up on the production target — no Composer, no pnpm, no pcov.
      target: base
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    # Laravel's scheduler has no daemon of its own — it is a set of
    # declarations (routes/console.php) a *process* has to evaluate once a
    # minute. schedule:work is that process: a long-running loop equivalent
    # to a single crontab line running `schedule:run` every 60 seconds,
    # without requiring a real crontab inside the container. Every
    # Schedule::job()/Schedule::command() entry — the backup, rollup, sweep,
    # sitemap, and cleanup jobs alike — only actually fires with this
    # service running; Horizon supervises queues, not cron time.
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Pinned explicitly: docker/app/Dockerfile now also defines a
      # `production` stage (the release artefact `release.yml` builds), and
      # an unpinned build resolves to whichever stage is declared last in
      # the file. Without this, a bind-mounted dev container would silently
      # come up on the production target — no Composer, no pnpm, no pcov.
      target: base
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pulse:
    # Drains the Redis stream config/pulse.php's "redis" ingest driver
    # writes to (see that file's own docblock) into Pulse's storage tables,
    # off the request/response cycle entirely — without this process, Pulse
    # entries would accumulate in Redis and never reach the dashboard.
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Pinned explicitly: docker/app/Dockerfile now also defines a
      # `production` stage (the release artefact `release.yml` builds), and
      # an unpinned build resolves to whichever stage is declared last in
      # the file. Without this, a bind-mounted dev container would silently
      # come up on the production target — no Composer, no pnpm, no pcov.
      target: base
    restart: unless-stopped
    command: php artisan pulse:work
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 8300, not 8000: Windows reserves 7915-8114 for Hyper-V dynamic ports on
      # this machine, and a bind inside a reserved range fails with a
      # permissions error rather than "address in use".
      - "8300:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    # PostGIS bundle rather than plain postgres: the catalog needs bbox and
    # radius queries for the map, "nearby objects", and the distance filters.
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking}
      POSTGRES_DB: ${DB_DATABASE:-booking}
    ports:
      # Host port 5433, not 5432 — this machine already runs a native
      # PostgreSQL Windows service bound to 5432.
      - "5433:5432"
    volumes:
      # postgres:18+ images store data under major-version-specific
      # subdirectories of /var/lib/postgresql (not .../data directly) —
      # https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-booking} -d ${DB_DATABASE:-booking}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Cache, session store, and the queue broker behind Horizon.
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for media. Keeps the storage interface
    # identical between local development and production, so the provider
    # (Cloudflare R2 / Backblaze B2 / self-hosted MinIO) stays a configuration
    # change rather than a migration.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-booking}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-booking-secret}
    ports:
      - "9000:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  mailpit:
    # Local SMTP sink — notification templates are developed against it
    # without sending real mail.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      # 8325, not 8025 — same Windows reserved range as the web port above.
      - "8325:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
