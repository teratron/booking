; PHP-FPM pool for the web-facing `app` container (the only service running
; `CMD ["php-fpm"]` — worker/scheduler/pulse each override `command:` to a
; long-running artisan process instead, so they never touch this pool).
;
; Without this file the image ships php-fpm's own vendor default
; (pm.max_children = 5) unchanged, confirmed live: every public, admin,
; cabinet, and API request across the whole portal shares one five-worker
; pool. A load test against this exact configuration (k6, 10 concurrent
; users, one endpoint) measured a 61% failure rate; the portal cannot be
; released against the unmodified default.
;
; Sizing below assumes an 8GB / 4vCPU instance with roughly 2GB reserved
; for PHP-FPM after Postgres, Redis, nginx, the OS, and the separate
; worker/scheduler/pulse containers (each their own PHP process, not this
; pool) take their share — ~60MB per warmed-up worker (Filament + the
; extensions this image installs: intl, pdo_pgsql, redis, imagick, gd)
; gives roughly 2048MB / 60MB ≈ 32 children. This is a planning default,
; not a measured ceiling for any specific box: re-run the formula
; (available_RAM_for_php_fpm ÷ observed per-worker RSS under real load)
; against the instance actually provisioned, and adjust before launch —
; see docs/production-provisioning.md.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

; A deliberate value, not php-fpm's own default of 511. Under a sustained
; arrival rate above what the pool can serve, requests queue on this
; backlog; once it fills, nginx gets connection-refused and returns 502 on
; every route, not just the one under load. 1024 gives a spike more room to
; drain (the catalog's own nginx limit_req, docker/nginx/default.conf, is
; the first line of defence); re-tune from the pre-launch load benchmark,
; which is what sizes pm.max_children too (see docs/php-fpm-capacity.md).
listen.backlog = 1024
