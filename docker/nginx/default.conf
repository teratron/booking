# A per-client rate zone for the catalog — the single most expensive
# render on the portal. A sustained burst on one
# heavy route must not fill the shared PHP-FPM listen backlog and starve
# every other page; past the burst allowance this returns 429 (with a
# Retry-After) rather than letting nginx queue the request until FPM
# refuses the connection and it becomes a 502 on unrelated routes.
limit_req_zone $binary_remote_addr zone=catalog:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Media is large and image-heavy; let the CDN and the storage service own
    # caching headers rather than duplicating a policy here.
    client_max_body_size 64m;

    # The catalog listing and the per-territory typed-catalog listing, the
    # two heaviest server renders. `burst` absorbs a normal navigation
    # flurry; `nodelay` serves the burst immediately and only rejects once
    # it is exhausted.
    # Quoted: an unquoted regex containing `{2}` would be parsed as a block open.
    location ~ "^/[a-z]{2}/catalog(/|$)" {
        limit_req zone=catalog burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # A bounded, self-describing rejection for a rate-limited catalog burst
    # — never nginx's bare default body, and with the Retry-After the
    # specification asks for.
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Retry-After 30 always;
        default_type text/plain;
        return 429 "Too many catalog requests. Retry in a moment.\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Dotfiles are never served — .env sitting one directory above the root is
    # the reason this rule is explicit rather than assumed.
    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
