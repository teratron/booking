# Scoped to the two protected branches (docs/release/branching.md): every
# push to every feature branch used to run this full gate against a real
# PostGIS service container, spending runner minutes proving that
# in-progress work is in progress. `develop` and `master` are where the
# result actually matters — a required status check on either.
name: Quality

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    # The Pest suite runs against real PostgreSQL/PostGIS, not SQLite — the
    # schema uses geography columns and Postgres-only partial indexes SQLite
    # cannot represent. Same image tag as the local docker-compose stack, so
    # a schema change that passes here behaves identically for a developer.
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U booking -d booking"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # .env.example's DB_PORT (5433) is a local-machine accommodation for a
    # port conflict this runner does not have; DB_HOST's 127.0.0.1 default
    # already matches the service port mapping above.
    env:
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — fallow's PR-diff
          # commands (`audit`, `review`) need the base branch's commits to
          # walk, which a fetch-depth: 1 checkout does not provide.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, pgsql, redis, imagick, gd, zip, bcmath, exif, pcntl
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # The service container's own init only creates the default POSTGRES_DB
      # (booking); the dedicated test database and its extensions — the same
      # ones docker/postgres/init/ provisions locally — are created here
      # instead, since GitHub's `services:` containers do not mount init
      # scripts the way docker-compose does.
      - name: Prepare test database
        run: |
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=booking", "booking", "booking");
            $pdo->exec("CREATE DATABASE booking_testing");
            $testPdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=booking_testing", "booking", "booking");
            $testPdo->exec("CREATE EXTENSION IF NOT EXISTS postgis");
            $testPdo->exec("CREATE EXTENSION IF NOT EXISTS pg_trgm");
            $testPdo->exec("CREATE EXTENSION IF NOT EXISTS unaccent");
          '

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Whole-project JS/CSS gate — formatting, linting, dead code, dependency
      # hygiene. Runs before the build so a cheap static check fails fast
      # ahead of a slower Vite build.
      - name: Run the JS quality gate
        run: pnpm run quality

      # PR-scoped: reviews only the files this PR actually changed, and
      # distinguishes newly introduced findings from pre-existing debt on the
      # base branch. Meaningless on a plain push with no base to diff against.
      - name: Audit changed files (pull request only)
        if: github.event_name == 'pull_request'
        run: pnpm run audit

      # Built before the PHP quality gate: the Pest suite includes a
      # permanent check that public/build/manifest.json exists, matching the
      # assertion a developer's own `pnpm build` satisfies locally.
      - name: Build assets
        run: pnpm build

      # The schema deliverable the waived approval gate still requires: the
      # migration set applying cleanly from a genuinely empty database is
      # the field list, the type list, and the key list, proven fresh on
      # every push rather than trusted from a developer's already-migrated
      # local database.
      - name: Verify migrate:fresh --seed from empty
        run: php artisan migrate:fresh --seed --force

      # One command, deliberately — this is the same command a developer runs
      # locally (composer.json's `quality` script). Two separate invocations of
      # the same gate is how "passes in CI, fails locally" divergence starts.
      - name: Run the PHP quality gate
        run: composer quality
