name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — fallow's PR-diff
          # commands (`audit`, `review`) need the base branch's commits to
          # walk, which a fetch-depth: 1 checkout does not provide.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, pgsql, redis, imagick, gd, zip, bcmath, exif, pcntl
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Whole-project JS/CSS gate — formatting, linting, dead code, dependency
      # hygiene. Runs before the build so a cheap static check fails fast
      # ahead of a slower Vite build.
      - name: Run the JS quality gate
        run: pnpm run quality

      # PR-scoped: reviews only the files this PR actually changed, and
      # distinguishes newly introduced findings from pre-existing debt on the
      # base branch. Meaningless on a plain push with no base to diff against.
      - name: Audit changed files (pull request only)
        if: github.event_name == 'pull_request'
        run: pnpm run audit

      # Built before the PHP quality gate: the Pest suite includes a
      # permanent check that public/build/manifest.json exists, matching the
      # assertion a developer's own `pnpm build` satisfies locally.
      - name: Build assets
        run: pnpm build

      # One command, deliberately — this is the same command a developer runs
      # locally (composer.json's `quality` script). Two separate invocations of
      # the same gate is how "passes in CI, fails locally" divergence starts.
      - name: Run the PHP quality gate
        run: composer quality
