name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, pgsql, redis, imagick, gd, zip, bcmath, exif, pcntl
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # One command, deliberately — this is the same command a developer runs
      # locally (composer.json's `quality` script). Two separate invocations of
      # the same gate is how "passes in CI, fails locally" divergence starts.
      - name: Run the quality gate
        run: composer quality
