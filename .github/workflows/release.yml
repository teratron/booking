# The release path (docs/release/pipeline.md): triggered by a version tag,
# builds the artefact every later job in this workflow addresses by digest,
# then deploys it. `verify`/`rollback` and `record` are added on top of
# `deploy` as their own preconditions come into existence.
name: Release

on:
  push:
    tags:
      - "v*"

# Repository-tier secrets only: registry credentials and the map tile build
# argument. Nothing in the `production` environment's own secret tier is
# readable from this job.
permissions:
  contents: read
  packages: write

# One group covering the whole production line, not one per tag — two tags
# pushed minutes apart must queue, never interleave. `cancel-in-progress:
# false` is load-bearing: a cancelled release that had already migrated is
# exactly the half-applied state this exists to prevent, once `deploy`
# lands in this same workflow.
concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Gates everything below it: a release whose migration set cannot be
  # reversed by a plain rollback must say so before an image is even built,
  # not be discovered once the artefact already exists.
  scan-migrations:
    runs-on: ubuntu-latest

    outputs:
      declaration: ${{ steps.declaration.outputs.text }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # The tag's own annotation message is the release's irreversibility
      # declaration — never inferred, always this one explicit surface.
      # `%(contents)` is empty for a lightweight (unannotated) tag, which
      # correctly reads as "no declaration".
      # The tag name reaches this step as a real shell variable ($TAG), not
      # interpolated by the Actions template engine into the script text —
      # anyone who can push a tag controls its name, and a `${{ github.
      # ref_name }}` literal here would let a crafted tag name (backticks,
      # `$(...)`, `;`) execute as part of this command rather than being
      # passed to git as inert argument text.
      - name: Read this release's irreversibility declaration
        id: declaration
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "text<<TAG_ANNOTATION_EOF"
            git tag -l --format='%(contents)' "$TAG"
            echo "TAG_ANNOTATION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Scan for destructive migrations
        env:
          DECLARATION: ${{ steps.declaration.outputs.text }}
        run: php artisan release:scan-destructive-migrations --declaration="$DECLARATION"

  build:
    needs: scan-migrations
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # master is the single production line. A `push: tags:` trigger has no
      # native "and only when the tag sits on this branch" filter — GitHub
      # Actions branch filters do not apply to tag-push events at all — so
      # the restriction is enforced here instead of assumed from the
      # trigger syntax.
      - name: Verify the tag is reachable from master
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "::error::${TAG} was not built from a commit on master — refusing to release it."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production target: no Composer, no Node/pnpm, no pcov, no git —
      # docker/app/Dockerfile's own `production` stage. Tagged with both the
      # version and `latest`; every later job in this workflow addresses the
      # artefact by the immutable digest this step emits, never by tag.
      - name: Build and push the production image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MAP_TILE_KEY=${{ secrets.MAP_TILE_KEY }}

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published ${IMAGE}@${DIGEST}"

  # Gated by the `production` environment's own required-reviewers rule —
  # this job does not start running until a human approves it there. Runs on
  # a self-hosted runner installed on the production host itself, the
  # mechanism that satisfies "the host pulls, no inbound access to it is
  # ever required" (l2-release-pipeline.md §2): the runner polls GitHub
  # outbound for work, exactly like any other pull-based agent would, so
  # there is no separate network path into the host to secure.
  deploy:
    needs: build
    runs-on: [self-hosted, production]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        env:
          MAINTENANCE_BYPASS_SECRET: ${{ secrets.MAINTENANCE_BYPASS_SECRET }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          chmod +x docker/deploy/deploy.sh
          ./docker/deploy/deploy.sh "$DIGEST"

  # A measurement, not a judgement (l1-release-operations.md §5.2) — runs
  # immediately after deploy, without waiting for a person. `environment:
  # production` here shares the one approval `deploy` already obtained for
  # this workflow run (GitHub re-prompts per *environment* per run, not per
  # job) — needed for read access to the same maintenance-bypass secret,
  # never to gate this job behind a second approval.
  verify:
    needs: [build, deploy]
    runs-on: [self-hosted, production]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Poll the health route
        run: |
          chmod +x docker/deploy/verify-health.sh
          ./docker/deploy/verify-health.sh

      # Success — this digest becomes what `rollback` would redeploy if a
      # *future* release fails its own verify.
      - name: Record this release as last known-good
        if: success()
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          chmod +x docker/deploy/last-good-digest.sh
          ./docker/deploy/last-good-digest.sh record "$DIGEST"

      # Failure — protect visitors from the release that just failed its own
      # health check while `rollback` (below) recovers automatically.
      # `deploy` already left maintenance mode; this step re-enters it.
      - name: Enter maintenance mode ahead of automatic rollback
        if: failure()
        env:
          MAINTENANCE_BYPASS_SECRET: ${{ secrets.MAINTENANCE_BYPASS_SECRET }}
        run: |
          docker compose -p booking-production -f docker-compose.production.yml \
            exec -T app php artisan down --secret="$MAINTENANCE_BYPASS_SECRET" --render="errors::503"

  # Agent-decidable per l1-release-operations.md §5.5 — triggering rollback on
  # a failed health assertion never waits for a person, unlike accepting the
  # release that made it necessary in the first place.
  rollback:
    needs: [build, verify]
    if: needs.verify.result == 'failure'
    runs-on: [self-hosted, production]
    environment: production

    # Exposed as a job output, not read back from the host's own state file
    # by a later job — `record` (next) may run on an ordinary hosted runner
    # with no filesystem in common with this one at all.
    outputs:
      reverted_to_digest: ${{ steps.last_good.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the last known-good digest
        id: last_good
        run: |
          chmod +x docker/deploy/last-good-digest.sh
          echo "digest=$(./docker/deploy/last-good-digest.sh read)" >> "$GITHUB_OUTPUT"

      - name: Roll back
        env:
          DIGEST: ${{ steps.last_good.outputs.digest }}
        run: |
          chmod +x docker/deploy/rollback.sh
          ./docker/deploy/rollback.sh "$DIGEST"

      # Exactly once — an assertion, not another deployment
      # (l2-release-pipeline.md §5.6). A brief grace period first: the
      # containers `rollback.sh` just restarted need a moment to actually
      # start serving before the single check means anything.
      - name: Re-assert health once
        run: |
          sleep 5
          chmod +x docker/deploy/verify-health.sh
          ./docker/deploy/verify-health.sh 1 0

      - name: Leave maintenance mode — rollback restored health
        if: success()
        run: |
          docker compose -p booking-production -f docker-compose.production.yml exec -T app php artisan up

      # The rollback redeployed a digest that was healthy moments ago and is
      # still unhealthy now — the fault is almost certainly the host, the
      # database, or an external dependency, not the image. Stopping here
      # rather than trying anything else is the point of this step, not a
      # gap in it: the application stays in maintenance mode, and this job's
      # own failure is what `record` (next) reads to write the escalation
      # into the release record and point operators at the restore
      # procedure.
      - name: Escalate — rollback did not restore health
        if: failure()
        env:
          DIGEST: ${{ steps.last_good.outputs.digest }}
        run: |
          echo "::error::Rollback to ${DIGEST} did not restore health. The application remains in maintenance mode — this requires human investigation. See docs/operations/en/read-a-failed-pipeline.md and docs/operations/en/restore.md."

  # l1-release-operations.md §3.5: created at the production-line transition,
  # not only after a success — `if: always()` runs this regardless of which
  # job above failed, as long as the release actually reached the point of
  # having something to record (`scan-migrations` refusing the release
  # outright is a rejected candidate, not a production event; nothing after
  # it ever ran, and this job does not manufacture a release record for it).
  # An ordinary hosted runner is enough — this job never touches the
  # production host, only the GitHub API and this repository's own
  # CHANGELOG.md.
  record:
    needs: [scan-migrations, build, deploy, verify, rollback]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Every value below reaches the script as a real shell variable, never
      # interpolated by the Actions template engine into the run: text
      # itself — TAG and DECLARATION are both attacker-influenceable free
      # text (anyone who can push a tag controls its name and its
      # annotation message), and a `${{ }}` literal inline here would let a
      # crafted tag name or declaration execute as shell rather than being
      # passed to the script as inert argument text.
      - name: Record the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          DECLARATION: ${{ needs.scan-migrations.outputs.declaration }}
          REVERTED_TO_DIGEST: ${{ needs.rollback.outputs.reverted_to_digest }}
        run: |
          chmod +x docker/deploy/record-release.sh
          ./docker/deploy/record-release.sh \
            "$TAG" \
            "$DIGEST" \
            "$DEPLOY_RESULT" \
            "$VERIFY_RESULT" \
            "$ROLLBACK_RESULT" \
            "$DECLARATION" \
            "$REVERTED_TO_DIGEST"
